name: needs
on: push

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
    - name: echo
      run: echo "job1 done"

  # job1이 성공한 이후에 job2가 실행되도록 한다.
  job2:
    runs-on: ubuntu-latest
    needs: [job1]
    steps:
    - name: echo
      run: echo "job2 done"

  # job3은 강제 실패가 되도록 한다.
  job3:
    runs-on: ubuntu-latest
    steps:
    - name: echo
      run: echo "job3 done"
      exit 1

  # job4는 job3에 종속성이 생기도록 한다.
  job4:
    runs-on: ubuntu-latest
    needs: [job3]
    steps:
    - name: echo
      run: echo "job4 done"
